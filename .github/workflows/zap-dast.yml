name: OWASP ZAP DAST Scan

on:
  schedule:
    # Weekly scan — Sundays at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API base URL'
        required: false
        default: 'http://localhost:4000'

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '20'

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: monitoreo_v2
          POSTGRES_PASSWORD: monitoreo2026
          POSTGRES_DB: monitoreo_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoreo_v2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: monitoreo-v2/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: monitoreo-v2/backend
        run: npm ci

      - name: Apply database migrations
        working-directory: monitoreo-v2/backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: monitoreo_v2
          DB_USERNAME: monitoreo_v2
          DB_PASSWORD: monitoreo2026
        run: |
          for f in ../database/migrations/*.sql; do
            psql "postgresql://monitoreo_v2:monitoreo2026@localhost:5432/monitoreo_v2" -f "$f" 2>/dev/null || true
          done

      - name: Start backend API
        working-directory: monitoreo-v2/backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: monitoreo_v2
          DB_USERNAME: monitoreo_v2
          DB_PASSWORD: monitoreo2026
          JWT_SECRET: zap-test-secret-minimum-32-chars!!
          COOKIE_SECRET: zap-test-cookie-secret
          FRONTEND_URL: http://localhost:5173
          GOOGLE_CLIENT_ID: zap-test-google
          MICROSOFT_CLIENT_ID: zap-test-microsoft
          MICROSOFT_TENANT_ID: zap-test-tenant
          NODE_ENV: development
        run: |
          npm run start:dev &
          sleep 10
          curl -sf http://localhost:4000/api/health || (echo "API failed to start" && exit 1)

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ inputs.target_url || 'http://localhost:4000/api' }}
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j -l WARN'
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_id }}
          path: report_html.html
          retention-days: 30

      - name: Upload ZAP JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-json-${{ github.run_id }}
          path: report_json.json
          retention-days: 30
