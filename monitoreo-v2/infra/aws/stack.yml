AWSTemplateFormatVersion: '2010-09-09'
Description: monitoreo-v2 - API (Lambda + HTTP API), scheduled jobs, PostgreSQL, SPA (S3 + CloudFront)

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  DomainName:
    Type: String
    Default: ''
  HostedZoneId:
    Type: String
    Default: ''
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
  DbBackupRetentionDays:
    Type: Number
    Default: 7
  MicrosoftTenantId:
    Type: String
  MicrosoftClientId:
    Type: String
  GoogleClientId:
    Type: String
  SesFromEmail:
    Type: String
    Default: ''

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasSesFromEmail: !Not [!Equals [!Ref SesFromEmail, '']]

Resources:
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/jwt-secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  CookieSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/cookie-secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ConfigEncryptionKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/config-encryption-key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/db-password
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} PostgreSQL (TLS enforced, Lambda runs outside VPC)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: !Sub ${AWS::StackName} force TLS
      Parameters:
        rds.force_ssl: '1'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-db
      Engine: postgres
      EngineVersion: '16.15'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: monitoreo_v2
      MasterUsername: emadmin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbPasswordSecret}}}'
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups:
        - !GetAtt DbSecurityGroup.GroupId
      PubliclyAccessible: true
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

  ExportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-exports
            Status: Enabled
            ExpirationInDays: 7

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ExportsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - sns:Publish
                Resource: '*'

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: lambda.handler
      MemorySize: 1024
      Timeout: 300
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          NODE_ENV: production
          LOG_FORMAT: json
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: monitoreo_v2
          DB_USERNAME: emadmin
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DbPasswordSecret}}}'
          RDS_CA_BUNDLE_PATH: certs/rds-global-bundle.pem
          JWT_SECRET: !Sub '{{resolve:secretsmanager:${JwtSecret}}}'
          COOKIE_SECRET: !Sub '{{resolve:secretsmanager:${CookieSecret}}}'
          CONFIG_ENCRYPTION_KEY: !Sub '{{resolve:secretsmanager:${ConfigEncryptionKey}}}'
          FRONTEND_URL: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
          WEBAUTHN_RP_ID: !If [HasDomain, !Ref DomainName, !GetAtt Distribution.DomainName]
          WEBAUTHN_ORIGIN: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
          WEBAUTHN_RP_NAME: Energy Monitor
          MICROSOFT_TENANT_ID: !Ref MicrosoftTenantId
          MICROSOFT_CLIENT_ID: !Ref MicrosoftClientId
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          EXPORT_S3_BUCKET: !Ref ExportsBucket
          SES_FROM_EMAIL: !If [HasSesFromEmail, !Ref SesFromEmail, !Ref AWS::NoValue]

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  HttpApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-jobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ApiFunction.Arn

  AlertEngineSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"alert-engine"}'

  AlertEscalationSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: rate(10 minutes)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"alert-escalation"}'

  ReportsSchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"reports-scheduler"}'

  IngestGapDetectorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"ingest-gap-detector"}'

  DataRetentionSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(0 8 * * ? *)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"data-retention"}'

  DataQualityRollupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(30 3 * * ? *)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"data-quality-rollup"}'

  MeterBalanceCheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(0 4 * * ? *)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"meter-balance-check"}'

  DataSloFreshnessSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(15 4 * * ? *)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job":"data-slo-freshness"}'

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName}
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Select [1, !Split ['//', !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DomainRecordIpv4:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
  DistributionId:
    Value: !Ref Distribution
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DbPasswordSecretArn:
    Value: !Ref DbPasswordSecret
  FunctionName:
    Value: !Ref ApiFunction
